name: Android
# Builds the phone APK. Release runs call this after the desktop release exists.
# Pull requests only build and keep the unsigned APK as a workflow artifact.
on:
  pull_request:
    paths:
      - mobile/**
      - web/apps/mobile/**
      - web/package-lock.json
      - go.mod
      - Taskfile.yml
      - .github/workflows/android.yml
  workflow_call:
    inputs:
      version:
        description: Release version, for example 0.1.4-nightly.202611221200
        type: string
        required: true
      upload:
        description: Sign the APK and attach it to the release v<version>
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Pinned so builds repeat. Both tools come from the same x/mobile commit.
  GOMOBILE_VERSION: v0.0.0-20261117202452-47699113848a
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS_VERSION: 35.0.0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          name="${INPUT_VERSION:-0.0.0-ci.$GITHUB_RUN_NUMBER}"
          # Android wants an integer that only goes up: minutes since 2026-11-01 UTC.
          code=$(( ($(date -u +%s) - $(date -u -d 2026-11-01 +%s)) / 60 ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "TAILSHARE_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "TAILSHARE_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Install Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accepting licences lets Gradle fetch the platform parts Expo asks for.
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          # Only this runner's go.mod changes; bind needs x/mobile/bind in the module.
          go get "golang.org/x/mobile@$GOMOBILE_VERSION"
          # gomobile reads ANDROID_NDK_HOME; init has no -ndk flag.
          gomobile init
      - run: npm ci
        working-directory: web
      - name: Build the APK
        run: task mobile:apk
      - name: Show what gomobile built
        run: |
          unzip -l web/apps/mobile/modules/tailshare-core/android/libs/tailshare.aar
          unzip -p web/apps/mobile/modules/tailshare-core/android/libs/tailshare.aar classes.jar > "$RUNNER_TEMP/classes.jar"
          unzip -l "$RUNNER_TEMP/classes.jar" | grep -i tailshare
      - name: Collect the APK
        run: |
          mapfile -t apks < <(find web/apps/mobile/android/app/build/outputs/apk/release -name '*.apk')
          [ "${#apks[@]}" -eq 1 ] || { echo "Expected one APK, found ${#apks[@]}."; exit 1; }
          mkdir -p dist
          cp "${apks[0]}" "dist/Tailshare-${TAILSHARE_VERSION_NAME}-unsigned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailshare-apk-unsigned
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
  # Signing and upload stay in their own job so the keystore secrets never reach
  # a pull request run and the build job keeps read-only access.
  upload:
    needs: build
    if: inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tailshare-apk-unsigned
          path: unsigned
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION"
          apksigner="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          mkdir -p dist
          # The keystore is PKCS12, so apksigner needs --ks-type.
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/Tailshare-$VERSION.apk" \
            "unsigned/Tailshare-$VERSION-unsigned.apk"
          "$apksigner" verify --print-certs "dist/Tailshare-$VERSION.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Attach the APK to the release
        run: gh release upload "v$VERSION" "dist/Tailshare-$VERSION.apk" --clobber
  # Pull requests only: start the app on an emulator, check it stays up, and
  # keep light and dark screenshots. A throwaway key signs it for the install.
  smoke:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tailshare-apk-unsigned
          path: unsigned
      - name: Sign with a throwaway key
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION"
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smokepass -keypass smokepass \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname CN=smoke
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" \
            --ks-pass pass:smokepass --out smoke.apk unsigned/*.apk
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install smoke.apk
            mkdir -p shots
            adb shell cmd uimode night no
            adb shell monkey -p connor.davis.tailshare -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof connor.davis.tailshare
            adb exec-out screencap -p > shots/phone-join-light.png
            adb shell cmd uimode night yes
            sleep 8
            adb shell pidof connor.davis.tailshare
            adb exec-out screencap -p > shots/phone-join-dark.png
            adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > shots/logcat-errors.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tailshare-phone-screens
          path: shots/
          retention-days: 14
