name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version and skip an existing release
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content web/apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^0\.1\.\d+$') { throw 'Expected a stable 0.1.x version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          $response = gh api --include "repos/$env:GH_REPO/releases/tags/v$version" 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } elseif ($response -match 'HTTP/\S+ 404|HTTP 404') {
            "exists=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "Could not check for existing release: $response"
          }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Task
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$(go env GOPATH)/bin" >> $env:GITHUB_PATH
      - run: npm ci
        if: steps.version.outputs.exists == 'false'
        working-directory: web
      - name: Build without publishing
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: task dist VERSION=$env:VERSION CHANNEL=latest
      - name: Publish stable release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Builder's GitHub manifest uses safe names with hyphens.
          $installer = "Tailshare-Setup-$env:VERSION.exe"
          Copy-Item -LiteralPath "dist/Tailshare Setup $env:VERSION.exe" -Destination "dist/$installer"
          Copy-Item -LiteralPath "dist/Tailshare Setup $env:VERSION.exe.blockmap" -Destination "dist/$installer.blockmap"
          if (!(Select-String -LiteralPath dist/latest.yml -SimpleMatch "path: $installer")) {
            throw 'Installer name does not match the update manifest.'
          }
          $assets = @("dist/$installer", "dist/$installer.blockmap", 'dist/latest.yml')
          if (Test-Path dist/nightly.yml) { $assets += 'dist/nightly.yml' }
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          gh release create "v$env:VERSION" --target $env:RELEASE_SHA --title "Tailshare $env:VERSION" --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
