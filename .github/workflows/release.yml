name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      created: ${{ steps.version.outputs.exists == 'false' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version and skip an existing release
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./web/apps/desktop/package.json').version")
          [[ $version =~ ^0\.1\.[0-9]+$ ]] || { echo "Expected a stable 0.1.x version."; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # "release not found" is the normal answer for a new version; any other failure stops the run.
          if gh release view "v$version" > /dev/null 2> release-check.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "release not found" release-check.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat release-check.txt
            exit 1
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Task
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$(go env GOPATH)/bin" >> $env:GITHUB_PATH
      - run: npm ci
        if: steps.version.outputs.exists == 'false'
        working-directory: web
      - name: Build without publishing
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: |
          task dist VERSION=$env:VERSION CHANNEL=latest GOARCH=amd64 "TARGETS=nsis portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          task dist VERSION=$env:VERSION CHANNEL=latest GOARCH=arm64 "TARGETS=nsis portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish stable release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Keep the x64 asset names compatible with installed copies.
          $assets = @()
          foreach ($arch in @('x64', 'arm64')) {
            $suffix = if ($arch -eq 'arm64') { '-arm64' } else { '' }
            $installer = "Tailshare-Setup-$env:VERSION$suffix.exe"
            Copy-Item -LiteralPath "dist/Tailshare Setup $env:VERSION$suffix.exe" -Destination "dist/$installer"
            Copy-Item -LiteralPath "dist/Tailshare Setup $env:VERSION$suffix.exe.blockmap" -Destination "dist/$installer.blockmap"
            $manifest = "dist/latest$suffix.yml"
            if (!(Select-String -LiteralPath $manifest -SimpleMatch "path: $installer")) {
              throw "Installer name does not match $manifest."
            }
            $assets += @("dist/$installer", "dist/$installer.blockmap", $manifest, "dist/Tailshare-Portable-$env:VERSION-$arch.exe")
          }
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          gh release create "v$env:VERSION" --target $env:RELEASE_SHA --title "Tailshare $env:VERSION" --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # Only a newly created release gets an APK, like the desktop installer.
  android:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.release.outputs.version }}
      upload: true
    secrets: inherit
    permissions:
      contents: write
  # Linux and macOS packages join a newly created release, like the APK.
  desktop-unix:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/desktop-unix.yml
    with:
      version: ${{ needs.release.outputs.version }}
      channel: latest
      upload: true
    permissions:
      contents: write
