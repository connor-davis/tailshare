# Every everyday command in one place. Needs https://taskfile.dev
#
#   task          list all tasks
#   task check    everything CI would check
version: "3"

vars:
  BIN: bin/tailshare{{exeExt}}
  PACKAGE_VERSION:
    sh: node -p "JSON.parse(require('node:fs').readFileSync('web/apps/desktop/package.json', 'utf8')).version"
  # Name the Go roots so go never walks into web/ node_modules.
  GO_PKGS: ./cmd/... ./internal/... ./mobile/... ./tests/...

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the sidecar into bin/
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      VERSION_FLAG: -X github.com/connor-davis/tailshare/internal/platform/config.Version={{.VERSION}}
    # Task does not carry a caller task's environment into a nested task.
    # Empty GO values preserve the Go tool's native defaults for ordinary builds.
    env:
      GOOS: '{{.GOOS | default ""}}'
      GOARCH: '{{.GOARCH | default ""}}'
      CGO_ENABLED: '{{.CGO_ENABLED | default ""}}'
    cmds:
      - go build -trimpath -ldflags "{{.VERSION_FLAG}}" -o {{.BIN}} ./cmd/tailshare

  dist:
    desc: Build a sidecar and desktop package (Windows x64 NSIS by default)
    vars:
      RELEASE_VERSION: '{{.VERSION | default .PACKAGE_VERSION}}'
      CHANNEL: '{{.CHANNEL | default "latest"}}'
      GOOS: '{{.GOOS | default "windows"}}'
      GOARCH: '{{.GOARCH | default "amd64"}}'
      TARGETS: '{{.TARGETS | default "nsis"}}'
      BUILDER_OS: '{{if eq .GOOS "windows"}}win{{else if eq .GOOS "darwin"}}mac{{else}}{{.GOOS}}{{end}}'
      BUILDER_ARCH: '{{if eq .GOARCH "amd64"}}x64{{else}}{{.GOARCH}}{{end}}'
      SIDECAR: 'bin/tailshare{{if eq .GOOS "windows"}}.exe{{end}}'
      FEED_CHANNEL: '{{.CHANNEL}}{{if and (eq .GOOS "windows") (eq .GOARCH "arm64")}}-arm64{{end}}'
    preconditions:
      - sh: 'test "{{.CHANNEL}}" = latest || test "{{.CHANNEL}}" = nightly'
        msg: CHANNEL must be latest or nightly
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      CGO_ENABLED: "0"
      TAILSHARE_SIDECAR_NAME: 'tailshare{{if eq .GOOS "windows"}}.exe{{end}}'
      TAILSHARE_ARTIFACT_SUFFIX: '{{if eq .GOARCH "arm64"}}-arm64{{end}}'
    cmds:
      - task: build
        vars:
          BIN: "{{.SIDECAR}}"
          VERSION: "{{.RELEASE_VERSION}}"
          GOOS: "{{.GOOS}}"
          GOARCH: "{{.GOARCH}}"
          CGO_ENABLED: "0"
      - task: build:web
      - task: icons
      - cd web/apps/desktop && npx electron-builder --{{.BUILDER_OS}} {{.TARGETS}} --{{.BUILDER_ARCH}} --publish never -c.extraMetadata.version={{.RELEASE_VERSION}} -c.publish.channel={{.FEED_CHANNEL}}

  icons:
    desc: Export and verify the Tailshare app and tray icons from logo.svg
    cmds:
      - node web/apps/desktop/scripts/export-icons.mjs

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w cmd internal mobile tests

  fmt:check:
    desc: Fail if any Go file is not gofmt-clean
    cmds:
      - test -z "$(gofmt -l cmd internal mobile tests)" || (gofmt -l cmd internal mobile tests && exit 1)

  vet:
    desc: go vet and staticcheck
    cmds:
      - go vet {{.GO_PKGS}}
      - go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 {{.GO_PKGS}}

  test:
    desc: Go tests (offline)
    cmds:
      - go test -timeout 10m {{.GO_PKGS}}

  test:net:
    desc: Go tests including the live Tailcat relay test (needs internet)
    env:
      TAILSHARE_NET: "1"
    cmds:
      - go test -timeout 10m {{.GO_PKGS}}

  check:
    desc: gofmt, vet, staticcheck, Go tests, web lint and web tests
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: lint:web
      - task: test:web

  web:install:
    desc: Install the npm workspace dependencies
    cmds:
      - cd web && npm install

  dev:
    desc: Run the desktop app in development (builds the sidecar first)
    deps: [build]
    cmds:
      - cd web && npm run dev --workspace @tailshare/desktop

  lint:web:
    desc: Check TypeScript types, ESLint and formatting
    cmds:
      - cd web && npx turbo run typecheck lint
      - cd web && npx prettier --check .

  test:web:
    desc: Desktop main-process tests (offline, no Electron needed)
    cmds:
      - cd web && npx turbo run test

  build:web:
    desc: Build the desktop bundles
    cmds:
      - cd web && npx turbo run build

  mobile:aar:
    desc: Build the Go phone library (CI only; needs gomobile, JDK 17 and the Android NDK)
    cmds:
      - gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -o web/apps/mobile/modules/tailshare-core/android/libs/tailshare.aar ./mobile/tailshare

  mobile:apk:
    desc: Build the Android APK from the Go library and the Expo app (CI only, never in check)
    cmds:
      - task: mobile:aar
      - cd web/apps/mobile && npx expo prebuild --platform android --no-install --clean
      - cd web/apps/mobile/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
