appId: connor.davis.Tailshare
productName: Tailshare
asar: true
publish:
  provider: github
  owner: connor-davis
  repo: tailshare
  channel: latest
directories:
  output: ../../../dist
files:
  - out/**
extraResources:
  - from: ../../../bin/${env.TAILSHARE_SIDECAR_NAME}
    to: ${env.TAILSHARE_SIDECAR_NAME}
  - from: build/tray-16.png
    to: tray-16.png
  - from: build/tray-32.png
    to: tray-32.png
protocols:
  name: Tailshare room link
  schemes: [tailshare]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
  icon: build/icon.ico
  verifyUpdateCodeSignature: false
  requestedExecutionLevel: asInvoker
linux:
  # The architecture comes from the task's --x64 flag; one AppImage per run.
  target: AppImage
  # The package name @tailshare/desktop is not a safe file name.
  executableName: tailshare
  icon: build/icon.png
  category: Network
  artifactName: Tailshare-${version}-linux-${arch}.${ext}
mac:
  # Unsigned on purpose: there is no Apple account. First launch needs right-click, Open.
  target: dmg
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Tailshare-${version}-mac-${arch}.${ext}
portable:
  artifactName: Tailshare-Portable-${version}-${arch}.${ext}
nsis:
  artifactName: Tailshare Setup ${version}${env.TAILSHARE_ARTIFACT_SUFFIX}.${ext}
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
