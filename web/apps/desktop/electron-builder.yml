appId: connor.davis.Tailshare
productName: Tailshare
asar: true
publish:
  provider: github
  owner: connor-davis
  repo: tailshare
  channel: latest
directories:
  output: ../../../dist
files:
  - out/**
extraResources:
  - from: ../../../bin/tailshare.exe
    to: tailshare.exe
  - from: build/tray-16.png
    to: tray-16.png
  - from: build/tray-32.png
    to: tray-32.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  verifyUpdateCodeSignature: false
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
