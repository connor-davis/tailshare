plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tailsharecore'
version = '0.1.0'

android {
  namespace "expo.modules.tailsharecore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Built by `task mobile:aar` (gomobile bind) before Gradle runs.
  implementation files("libs/tailshare.aar")
}
